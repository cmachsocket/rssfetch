[package]
name = "rssfetch"
version = "0.1.0"
edition = "2024"

[lib]
# 编译为 Python 扩展模块（cdylib），同时保留 rlib 以便未来写 Rust 测试。
name = "_rssfetch"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.29"
rss = "2"
reqwest = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
html2text = "0.17"
chrono = "0.4"
async-openai = { version = "0.42.1", features = ["chat-completion"] }
