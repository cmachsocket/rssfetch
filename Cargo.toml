[package]
name = "rssfetch"
version = "0.1.0"
edition = "2024"

[dependencies]
rss = "2"
reqwest = {version = "0.13"}
tokio = {version='1',features= ['full']}
html2text = "0.17"
serde-saphyr = "1"
serde = {version="1",features = ["derive"] }
futures = "0.3"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
async-openai = { version = "0.42.1", features = ["chat-completion"] }
